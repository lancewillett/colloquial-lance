# All colors must be in the form of '#rrggbb' or '#rgb'.
# You cannot use color names.

log-view:
  nickname-format: '%n: '
  scroller-highlight-color: '#888'
input-text:
  font-family: 'Lucida Grande'
  font-size: 12.0
  background-color: '#1e1e1e'
  color: '#e8e8e8'
member-list:
  font-family: 'Lucida Grande'
  font-size: 11.0
  color: '#e8e8e8'
  background-color: '#1e1e1e'
  operator:
    color: '#e8e8e8'
  selected:
    color: '#fff'
    background:
      # gradient
      top-line-color: '#4a566a'
      bottom-line-color: '#2f3848'
      top-color: '#3f4a5c'
      bottom-color: '#333c4c'
server-tree:
  font-family: 'Lucida Grande'
  font-size: 11.0
  background-color: '#26292e'
  highlight:
    color: '#F09722'
  newtalk:
    color: '#F09722'
  unread:
    color: '#5a8bd6'
  normal:
    active:
      color: '#e8e8e8'
    inactive:
      color: '#888'
  selected:
    active:
      color: '#fff'
    inactive:
      color: '#aaa'
    background:
      # gradient
      top-line-color: '#4a566a'
      bottom-line-color: '#2f3848'
      top-color: '#3f4a5c'
      bottom-color: '#333c4c'
